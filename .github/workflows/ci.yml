name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository privacy
        run: pnpm privacy:check
      - name: Verify direct dependency licenses
        run: pnpm licenses:check
      - name: Scan high-severity dependency vulnerabilities
        run: pnpm audit --audit-level high
      - name: Typecheck, test and build
        run: pnpm check
