appId: com.company.ecommerce-data-platform
productName: 电商多店铺数据管理平台
directories:
  output: ../../dist
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: resources/icon.png
    to: icon.png
win:
  icon: resources/icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
